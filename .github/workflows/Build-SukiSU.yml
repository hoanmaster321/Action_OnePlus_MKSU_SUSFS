name: Build OnePlus 15 SukiSU Ultra Kernel (SM8850)

on:
  workflow_dispatch:
    inputs:
      SUSFS_CI:
        type: boolean
        description: "Download SUSFS module from CI?"
        required: true
        default: true
      VFS:
        type: boolean
        description: "Enable manual VFS hooks?"
        required: true
        default: true
      KPM:
        type: boolean
        description: "Enable KPM?"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "Add extra ZRAM algorithms (LZ4KD)?"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@kernel.local"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Clone kernel sources and sync
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail

          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000

          mkdir kernel_workspace
          cd kernel_workspace

          mkdir -p .repo/manifests

          curl -fL \
            https://raw.githubusercontent.com/hoanmaster321/Action_OnePlus_MKSU_SUSFS/main/oneplus_15.xml \
            -o .repo/manifests/oneplus_15.xml

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/sm8850 \
            -m oneplus_15.xml \
            --depth=1 \
            --no-clone-bundle \
            --no-tags

          # Sync with retry logic - codelinaro.org projects may need retries
          for attempt in 1 2 3; do
            echo "repo sync attempt $attempt..."
            if repo sync -c --no-clone-bundle --no-tags -j4 --fail-fast; then
              echo "repo sync succeeded on attempt $attempt"
              break
            else
              echo "repo sync attempt $attempt failed, retrying in 10s..."
              sleep 10
            fi
          done

          # Set up source_date_epoch_dir
          mkdir -p kernel_platform/.source_date_epoch_dir

          # Clean protected_exports_list
          if [ -e kernel_platform/common/BUILD.bazel ]; then
            sed -i '/protected_exports_list/d' kernel_platform/common/BUILD.bazel
          fi
          if [ -e kernel_platform/msm-kernel/BUILD.bazel ]; then
            sed -i '/protected_exports_list/d' kernel_platform/msm-kernel/BUILD.bazel
          fi

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

      - name: Remove -dirty suffix from kernel version
        run: |
          cd kernel_workspace/kernel_platform
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          if [ -f msm-kernel/scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' msm-kernel/scripts/setlocalversion
          fi
          if [ -f external/dtc/scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' external/dtc/scripts/setlocalversion
          fi
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          git add -A
          git commit -m "Force remove -dirty suffix from kernel version" || true

      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Apply SUSFS and ZRAM patches
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android16-6.12
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform

          echo "Applying SUSFS patches..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            echo "Applying ZRAM patches..."
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-android16-6.12.patch || true
          echo "SUSFS patches applied"

      - name: Apply hide stuff patch
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "Applying hide stuff patch (task_mmu.c)..."
          patch -p1 -F 5 < 69_hide_stuff.patch || true

          echo "Applying hide stuff to base.c for kernel 6.12..."
          python3 << 'PYEOF'
          import re

          with open("fs/proc/base.c", "r") as f:
              content = f.read()

          old = '''\trc = -ENOENT;
          \tvma = find_exact_vma(mm, vm_start, vm_end);
          \tif (vma && vma->vm_file) {
          \t\t*path = *file_user_path(vma->vm_file);
          \t\tpath_get(path);
          \t\trc = 0;
          \t}'''

          new = '''\trc = -ENOENT;
          \tvma = find_exact_vma(mm, vm_start, vm_end);
          \tif (vma) {
          \t\tif (vma->vm_file) {
          \t\t\tif (strstr(vma->vm_file->f_path.dentry->d_name.name, "lineage")) {
          \t\t\t\trc = kern_path("/system/framework/framework-res.apk", LOOKUP_FOLLOW, path);
          \t\t\t} else {
          \t\t\t\t*path = *file_user_path(vma->vm_file);
          \t\t\t\tpath_get(path);
          \t\t\t\trc = 0;
          \t\t\t}
          \t\t}
          \t}'''

          if old in content:
              content = content.replace(old, new)
              with open("fs/proc/base.c", "w") as f:
                  f.write(content)
              print("base.c hide stuff applied successfully")
          else:
              print("WARNING: base.c pattern not found, might already be patched or kernel version mismatch")
              print("Searching for find_exact_vma context:")
              for i, line in enumerate(content.split("\n")):
                  if "find_exact_vma(mm, vm_start, vm_end)" in line:
                      print(f"  Line {i+1}: {line}")
          PYEOF

      - name: Apply LZ4KD patch
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/other/zram/zram_patch/6.12/lz4kd.patch ./
          echo "Applying LZ4KD patch..."
          patch -p1 -F 3 < lz4kd.patch || true
          echo "LZ4KD patch done"

      - name: Configure kernel
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"

          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          sed -i 's/check_defconfig//' ./common/build.config.gki

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"

            if [ -e ./common/modules.bzl ]; then
              sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
            fi

            if [ -e ./msm-kernel/modules.bzl ]; then
              sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
              echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/canoe-GKI.config"
              echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/canoe-GKI.config"
            fi

            echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"

            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi

      - name: Build kernel
        run: |
          cd kernel_workspace
          LTO=thin \
          SYSTEM_DLKM_RE_SIGN=0 \
          BUILD_SYSTEM_DLKM=0 \
          KMI_SYMBOL_LIST_STRICT_MODE=0 \
          ./kernel_platform/oplus/build/oplus_build_kernel.sh canoe gki

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          dir1="kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/dist/"
          dir2="kernel_workspace/kernel_platform/bazel-out/k8-fastbuild/bin/msm-kernel/canoe_gki_kbuild_mixed_tree/"
          dir3="kernel_workspace/kernel_platform/out/msm-canoe-canoe-gki/dist/"
          dir4="kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/gki_kernel/common/arch/arm64/boot/"
          dir5="kernel_workspace/kernel_platform/out/msm-canoe-canoe-gki/gki_kernel/common/arch/arm64/boot/"

          if find "$dir1" -name "Image" | grep -q "Image"; then
            image_path="$dir1"Image
          elif find "$dir2" -name "Image" | grep -q "Image"; then
            image_path="$dir2"Image
          elif find "$dir3" -name "Image" | grep -q "Image"; then
            image_path="$dir3"Image
          elif find "$dir4" -name "Image" | grep -q "Image"; then
            image_path="$dir4"Image
          elif find "$dir5" -name "Image" | grep -q "Image"; then
            image_path="$dir5"Image
          else
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
          fi

          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            mkdir -p "$dir1"
            if [ "$(realpath "$image_path")" != "$(realpath "$dir1"Image)" ]; then
              cp "$image_path" "$dir1"
            fi
            cp "$dir1"Image ./AnyKernel3/Image
          else
            echo "Image not found, build may have failed"
            exit 1
          fi

          for file in dtbo.img system_dlkm.erofs.img vendor_dlkm.img vendor_boot.img; do
            if [ -f "$dir1$file" ]; then
              target_name="$file"
              if [ "$file" = "system_dlkm.erofs.img" ]; then
                target_name="system_dlkm.img"
              fi
              cp "$dir1$file" "./AnyKernel3/$target_name"
            fi
          done

      - name: Apply KPM patch_linux
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/dist

          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image

      - name: Download SUSFS module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'true' }}
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
            exit 1
          fi

          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')

          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs.zip "$ARTIFACT_URL"
          cp ksu_module_susfs.zip ./AnyKernel3/

      - name: Download SUSFS module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'false' }}
        run: |
          wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+.zip ./AnyKernel3/

      - name: Generate final artifact name
        id: suffix
        run: |
          suffix=""
          [ "${{ github.event.inputs.KPM }}" = "true" ] && suffix="${suffix}_KPM"
          [ "${{ github.event.inputs.VFS }}" = "true" ] && suffix="${suffix}_VFS"
          [ "${{ github.event.inputs.ZRAM }}" = "true" ] && suffix="${suffix}_LZ4KD"
          echo "value=$suffix" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_oneplus_15${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
